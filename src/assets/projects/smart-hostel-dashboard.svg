<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Smart Hostel &amp; Mess Management Dashboard mockup</title>
  <desc id="desc">Abstract representation of the Smart Hostel dashboard with a blue sidebar and green analytics cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e5ed4" />
      <stop offset="100%" stop-color="#0a3c91" />
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f5cff" />
      <stop offset="100%" stop-color="#3ba1ff" />
    </linearGradient>
    <linearGradient id="content" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f9ff" />
      <stop offset="100%" stop-color="#e9f2ff" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect x="260" y="60" width="960" height="600" rx="28" fill="url(#content)" />
  <rect x="260" y="60" width="960" height="120" rx="28" fill="#ffffff" />
  <rect x="260" y="60" width="960" height="120" rx="28" fill-opacity="0" stroke="#d6e4ff" stroke-width="2" />
  <rect x="40" y="60" width="200" height="600" rx="26" fill="#0f4fbb" opacity="0.92" />
  <g fill="#fff" opacity="0.9" font-family="'Segoe UI', 'Inter', sans-serif">
    <text x="80" y="120" font-size="32" font-weight="600">Dashboard</text>
    <text x="80" y="170" font-size="22" fill-opacity="0.65">Menu Management</text>
    <text x="80" y="210" font-size="22" fill-opacity="0.65">AI Recommendations</text>
    <text x="80" y="250" font-size="22" fill-opacity="0.65">Food Forecast</text>
    <text x="80" y="290" font-size="22" fill-opacity="0.65">Nutrition</text>
  </g>
  <rect x="300" y="90" width="260" height="70" rx="18" fill="url(#header)" opacity="0.9" />
  <text x="330" y="132" font-family="'Segoe UI', 'Inter', sans-serif" font-size="26" font-weight="600" fill="#ffffff">AI Alerts &amp; Recommendations</text>
  <rect x="320" y="210" width="600" height="140" rx="24" fill="#20c6a1" opacity="0.92" />
  <text x="350" y="260" font-size="28" font-weight="600" fill="#ffffff" font-family="'Segoe UI', 'Inter', sans-serif">Today's Nutrition Snapshot</text>
  <text x="350" y="300" font-size="48" font-weight="700" fill="#ffffff" font-family="'Segoe UI', 'Inter', sans-serif">1,690</text>
  <text x="520" y="300" font-size="20" fill="#d9fff5" font-family="'Segoe UI', 'Inter', sans-serif">Avg. Calories / Student</text>
  <text x="650" y="300" font-size="40" font-weight="700" fill="#ffffff" font-family="'Segoe UI', 'Inter', sans-serif">92</text>
  <text x="720" y="300" font-size="20" fill="#d9fff5" font-family="'Segoe UI', 'Inter', sans-serif">Nutrition Score</text>
  <g>
    <rect x="320" y="380" width="220" height="140" rx="22" fill="#ffffff" stroke="#d8e5ff" stroke-width="2" />
    <rect x="560" y="380" width="220" height="140" rx="22" fill="#ffffff" stroke="#d8e5ff" stroke-width="2" />
    <rect x="800" y="380" width="220" height="140" rx="22" fill="#ffffff" stroke="#d8e5ff" stroke-width="2" />
    <text x="350" y="420" font-size="20" font-weight="600" fill="#0f2f6b" font-family="'Segoe UI', 'Inter', sans-serif">Students Present</text>
    <text x="350" y="475" font-size="48" font-weight="700" fill="#0f4fbb" font-family="'Segoe UI', 'Inter', sans-serif">1,779</text>
    <text x="590" y="420" font-size="20" font-weight="600" fill="#0f2f6b" font-family="'Segoe UI', 'Inter', sans-serif">Meals Served</text>
    <text x="590" y="475" font-size="40" font-weight="700" fill="#1aa7ff" font-family="'Segoe UI', 'Inter', sans-serif">1,799 / 1,779</text>
    <text x="830" y="420" font-size="20" font-weight="600" fill="#0f2f6b" font-family="'Segoe UI', 'Inter', sans-serif">Food Waste</text>
    <text x="830" y="475" font-size="44" font-weight="700" fill="#ff5a6a" font-family="'Segoe UI', 'Inter', sans-serif">13.4 kg</text>
  </g>
  <rect x="1040" y="90" width="140" height="48" rx="16" fill="#ffffff" stroke="#c6d9ff" stroke-width="2" opacity="0.85" />
  <text x="1058" y="122" font-size="22" font-family="'Segoe UI', 'Inter', sans-serif" fill="#0f4fbb">Nutrition</text>
</svg>
