<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Railway AI dashboard mockup</title>
  <desc id="desc">Clean dashboard layout with blue sidebar and analytics cards inspired by the Railway AI control centre.</desc>
  <defs>
    <linearGradient id="rail-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8ff" />
      <stop offset="100%" stop-color="#eaf1ff" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#rail-bg)" />
  <rect x="60" y="70" width="220" height="580" rx="30" fill="#0d3cce" />
  <g font-family="'Inter', sans-serif" fill="#ffffff" opacity="0.88">
    <text x="110" y="140" font-size="30" font-weight="700">Dashboard</text>
    <text x="110" y="185" font-size="22" fill-opacity="0.7">Live Ops</text>
    <text x="110" y="225" font-size="22" fill-opacity="0.7">What-if</text>
    <text x="110" y="265" font-size="22" fill-opacity="0.7">Analytics</text>
    <text x="110" y="305" font-size="22" fill-opacity="0.7">AI Assistant</text>
  </g>
  <rect x="320" y="90" width="900" height="520" rx="36" fill="#ffffff" stroke="#d8e3ff" stroke-width="2" />
  <rect x="320" y="90" width="900" height="110" rx="36" fill="#ffffff" />
  <text x="360" y="150" font-family="'Inter', sans-serif" font-size="38" font-weight="700" fill="#102a5c">Train Management Dashboard</text>
  <rect x="360" y="190" width="480" height="36" rx="18" fill="#eff3ff" />
  <text x="380" y="214" font-family="'Inter', sans-serif" font-size="18" fill="#8293c9">Search trains...</text>
  <g>
    <rect x="360" y="250" width="260" height="160" rx="24" fill="#f5f8ff" stroke="#dbe6ff" stroke-width="2" />
    <rect x="640" y="250" width="260" height="160" rx="24" fill="#f5f8ff" stroke="#dbe6ff" stroke-width="2" />
    <rect x="920" y="250" width="260" height="160" rx="24" fill="#f5f8ff" stroke="#dbe6ff" stroke-width="2" />
    <text x="390" y="300" font-family="'Inter', sans-serif" font-size="22" fill="#2a2f55">Active Trains</text>
    <text x="390" y="360" font-family="'Inter', sans-serif" font-size="54" font-weight="700" fill="#0d3cce">247</text>
    <text x="670" y="300" font-family="'Inter', sans-serif" font-size="22" fill="#2a2f55">On-time Performance</text>
    <text x="670" y="360" font-family="'Inter', sans-serif" font-size="50" font-weight="700" fill="#2acb74">94.2%</text>
    <text x="950" y="300" font-family="'Inter', sans-serif" font-size="22" fill="#2a2f55">Active Alerts</text>
    <text x="950" y="360" font-family="'Inter', sans-serif" font-size="50" font-weight="700" fill="#ff8d4f">3</text>
  </g>
  <g opacity="0.95">
    <rect x="360" y="440" width="260" height="140" rx="24" fill="#ffffff" stroke="#dbe6ff" stroke-width="2" />
    <rect x="640" y="440" width="260" height="140" rx="24" fill="#ffffff" stroke="#dbe6ff" stroke-width="2" />
    <rect x="920" y="440" width="260" height="140" rx="24" fill="#ffffff" stroke="#dbe6ff" stroke-width="2" />
    <text x="390" y="485" font-family="'Inter', sans-serif" font-size="22" fill="#2a2f55">AI Recommendations</text>
    <text x="390" y="535" font-family="'Inter', sans-serif" font-size="44" font-weight="700" fill="#7638ff">156</text>
    <text x="670" y="485" font-family="'Inter', sans-serif" font-size="22" fill="#2a2f55">Network Throughput</text>
    <text x="670" y="535" font-family="'Inter', sans-serif" font-size="44" font-weight="700" fill="#0d3cce">247/hr</text>
    <text x="950" y="485" font-family="'Inter', sans-serif" font-size="22" fill="#2a2f55">Delay Reduction</text>
    <text x="950" y="535" font-family="'Inter', sans-serif" font-size="44" font-weight="700" fill="#ff4f8f">18.5 min</text>
  </g>
</svg>
